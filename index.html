  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='16' cy='16' r='10' fill='%23111'/%3E%3Ccircle cx='48' cy='16' r='10' fill='%23111'/%3E%3Ccircle cx='32' cy='36' r='24' fill='%23fff' stroke='%23111' stroke-width='3'/%3E%3Cellipse cx='23' cy='34' rx='6' ry='8' fill='%23111' transform='rotate(-20 23 34)'/%3E%3Cellipse cx='41' cy='34' rx='6' ry='8' fill='%23111' transform='rotate(20 41 34)'/%3E%3Ccircle cx='24' cy='33' r='2' fill='%23fff'/%3E%3Ccircle cx='40' cy='33' r='2' fill='%23fff'/%3E%3Cellipse cx='32' cy='46' rx='4' ry='3' fill='%23111'/%3E%3C/svg%3E">
  <script>
    /* Collect errors from the very first moment; the test harness reports them. */
    window.__pandaErrors = [];
    window.addEventListener('error', function (e) {
      window.__pandaErrors.push('Error: ' + e.message + (e.filename ? ' @ ' + e.filename.split('/').slice(-2).join('/') + ':' + e.lineno : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      window.__pandaErrors.push('Unhandled rejection: ' + (r && (r.stack || r.message) || r));
    });
    (function () {
      var orig = console.error;
      console.error = function () {
        try {
          window.__pandaErrors.push('console.error: ' + Array.prototype.map.call(arguments, function (a) {
            return a && a.stack ? a.stack : (typeof a === 'object' ? JSON.stringify(a) : String(a));
          }).join(' '));
        } catch (_) { /* ignore */ }
        return orig.apply(console, arguments);
      };
    })();
  </script>
